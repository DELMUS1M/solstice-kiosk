<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solstice Events - Check-In Kiosk</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    .row { display: flex; align-items: center; justify-content: space-between; border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; }
    .status { font-weight: 600; padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; }
    .not_checked_in { background: #eee; color: #555; }
    .print_pending { background: #fff3cd; color: #8a6d3b; }
    .checked_in { background: #d4edda; color: #256029; }
    button { padding: 6px 14px; border-radius: 6px; border: 1px solid #333; background: #fff; cursor: pointer; }
    button:hover { background: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Solstice Events - Check-In Kiosk</h1>
  <p>Scan a badge (click "Scan") to trigger a print job. Status stays <em>pending</em> until the vendor's webhook confirms the print actually completed.</p>
  <div id="list"></div>

  <script src="app.js"></script>
</body>
</html>
